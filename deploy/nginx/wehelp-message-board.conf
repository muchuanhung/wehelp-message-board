# WeHelp Message Board - Nginx 反向代理 + HTTPS
#
# 放置位置：/etc/nginx/conf.d/wehelp-message-board.conf
# 架構：Client -> (Load Balancer) -> Nginx :80/:443 -> FastAPI 容器 127.0.0.1:8000
#

# 請求是否原本就是 HTTPS：直連時看 $scheme，經過 Load Balancer 時看 LB 帶來的 X-Forwarded-Proto
map $http_x_forwarded_proto $message_board_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream message_board_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP：導向 HTTPS，但保留憑證驗證、健康檢查與 LB 轉送的流量
server {
    listen 80;
    listen [::]:80;
    server_name message-board.bid;

    # 圖片上限 5MB，加上 multipart 欄位的額外空間（Nginx 預設只有 1MB）
    client_max_body_size 6m;

    # 回應標頭標記是哪一台 instance 處理，用來確認負載平衡有分流
    add_header X-Served-By $hostname always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $message_board_forwarded_proto;

    # SSL For Free（ZeroSSL）HTTP 檔案驗證：
    # 將下載的驗證檔放到 /var/www/ssl-validation/.well-known/pki-validation/
    location ^~ /.well-known/pki-validation/ {
        root /var/www/ssl-validation;
        default_type text/plain;
    }

    # Load Balancer 健康檢查直接打 HTTP，不做導向
    location = /health {
        proxy_pass http://message_board_app;
    }

    location / {
        # 直連 HTTP 或 LB 的 HTTP 流量導向 HTTPS；LB 已終結 TLS（X-Forwarded-Proto: https）則直接代理
        if ($message_board_forwarded_proto != "https") {
            return 301 https://$host$request_uri;
        }
        proxy_pass http://message_board_app;
    }
}

# HTTPS：直連 EC2 時由 Nginx 終結 TLS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    # SSL For Free 下載的檔案：certificate.crt + ca_bundle.crt 合併成 fullchain.crt
    ssl_certificate     /etc/nginx/ssl/wehelp-message-board/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/wehelp-message-board/private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:message_board_ssl:10m;
    ssl_session_timeout 1d;

    client_max_body_size 6m;

    add_header X-Served-By $hostname always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location / {
        proxy_pass http://message_board_app;
    }
}
