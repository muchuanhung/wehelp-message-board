<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WeHelp Message Board</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="board">
      <section class="composer" aria-labelledby="composer-title">
        <h1 id="composer-title">發表一篇圖文</h1>
        <form id="message-form">
          <div class="field">
            <label for="content">文字內容</label>
            <input
              id="content"
              name="content"
              type="text"
              maxlength="1000"
              placeholder="選擇一張圖片後送出"
              required
            />
          </div>
          <div class="field">
            <label for="image">圖片檔案</label>
            <input
              id="image"
              name="image"
              type="file"
              accept="image/jpeg,image/png,image/webp,image/gif"
              required
            />
          </div>
          <p id="form-error" class="error" hidden></p>
          <button type="submit" id="submit-btn">送出</button>
        </form>
      </section>

      <hr />

      <section class="feed" aria-label="留言列表">
        <p id="feed-status" class="status">載入中…</p>
        <div id="message-list"></div>
      </section>
    </main>
    <script src="/static/app.js" defer></script>
  </body>
</html>
